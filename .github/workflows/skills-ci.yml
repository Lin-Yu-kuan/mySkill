name: Skills CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install --quiet pytest

      - name: Lint skills (frontmatter, version, install commands)
        run: python scripts/manage.py lint

      - name: Check root README is in sync
        run: python scripts/manage.py sync --check

      - name: Run skill tests
        run: python -m pytest -q
