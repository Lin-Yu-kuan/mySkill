# generated by skillkit: 改 skillkit/templates/skills-ci.yml，再到各專案跑 manage.cmd render
name: Skills CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - name: Checkout skill repo
        uses: actions/checkout@v4

      - name: Checkout skillkit
        uses: actions/checkout@v4
        with:
          repository: Lin-Yu-kuan/skillkit
          ref: main
          path: .ci/skillkit

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --quiet pytest
          for req in */requirements.txt; do
            if [ -f "$req" ]; then
              echo "Installing $req"
              python -m pip install --quiet -r "$req"
            fi
          done

      - name: Lint skills
        run: python .ci/skillkit/manage.py lint

      - name: Check generated files are in sync
        run: python .ci/skillkit/manage.py sync --check

      - name: Run skill tests
        run: python -m pytest -q
